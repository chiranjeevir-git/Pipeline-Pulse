server:
  port: 8080

spring:
  application:
    name: pulse
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${SPRING_DATASOURCE_USERNAME:pulse}
    password: ${SPRING_DATASOURCE_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql
